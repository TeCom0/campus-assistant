# The image's default site, without an access log: its format records
# X-Forwarded-For, which behind Caddy is the visitor's real IP address. nginx's
# error log only sees Caddy's address, so it stays on.
server {
    listen       80;
    server_name  localhost;
    access_log off;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
