# Production overrides (Ship plan step 5), applied on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Only Caddy is published (80/443). Postgres and the API stay on the private
# Compose network; the UI calls the API on the same origin, under /api.
# Needs DOMAIN in .env (e.g. DOMAIN=campus.example.com).
services:
  db:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      # Behind Caddy the TCP peer is always the proxy; the client IP comes from
      # the last X-Forwarded-For entry, which Caddy sets (app/limits.py).
      TRUST_PROXY_HEADERS: "true"
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in .env}

  frontend:
    build:
      args:
        # Same origin: the browser calls /api/chat, which Caddy routes to the API.
        VITE_API_URL: /api
    ports: !reset []

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      # Overridable only for a local test on a machine where 80/443 are taken.
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep them, or Let's Encrypt rate limits apply
      - caddy_config:/config
    depends_on:
      - api
      - frontend

volumes:
  caddy_data:
  caddy_config:
