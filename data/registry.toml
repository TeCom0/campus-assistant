# The documents the assistant answers from: what each one is and where it comes from.
#
# Read and validated by backend/app/registry.py. `python -m app.registry sync` copies it
# to the documents and document_editions tables, which is what the API reads, since this
# file isn't in the API's image. Whether an edition is live (its status) isn't here: it
# lives only in the database, so it can change without a redeploy (docs/architecture.md,
# section 3.1).
#
# An edition's id equals document_chunks.source, and data/raw/<id>.<format> is its file.

