# TEST FIXTURES: three invented documents for A2.4's scratch-database check (CLAUDE.md,
# "A2.4 rule", items 6-8). None of them is a university document, and they never go into
# data/registry.toml, the dev database or the VM.
#
# Same shape as data/registry.toml, so the real loader validates it, with two known gaps
# that later sub-steps close: the URLs use the reserved .invalid domain (sub-step 2 makes
# the allowed host a parameter), and no edition has course_tables (sub-step 7 loads this
# file together with the real registry, which has the one).
#
# Each file is <edition id>.<format> in this folder. .gitattributes turns off line-ending
# conversion here, so the sha256 values hold on every checkout. After rebuilding the PDF
# with make_fixture_pdf.py, update its sha256.

